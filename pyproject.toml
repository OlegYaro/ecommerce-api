[project]
name = "ecommerce-api"
version = "0.1.0"
description = "Vention e-commerce API"
authors = [
    {name = "Oleg Yaroshevich", email = "olafieros@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.1,<0.53.0)",
    "sqlalchemy[asyncio] (>=2.0.52,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (>=4.0,<4.1)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "greenlet (>=3.5.5,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)"
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 88

target-version = "py312"

exclude = [
    "alembic/versions",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "D",   # pydocstyle — докстринги требует ТЗ
    "B",   # bugbear
]

ignore = [
    "D100",
    "D104",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"alembic/*" = ["D", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.2,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "faker (>=40.36.0,<41.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"
